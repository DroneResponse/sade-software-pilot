exclude: "^docs/|devcontainer.json"
default_stages: [pre-commit]

default_language_version:
    python: python3.14

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: debug-statements
          - id: check-builtin-literals
          - id: end-of-file-fixer
          - id: check-json
          - id: check-toml
          - id: check-yaml
          - id: check-case-conflict
          - id: check-docstring-first
          - id: detect-private-key

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.4
      hooks:
          # Linter
          - id: ruff
            args:
                [
                    --no-cache,
                    --fix,
                    --exit-non-zero-on-fix,
                    --config,
                    "pyproject.toml",
                ]
          # Formatter
          - id: ruff-format
            args: [--config, "pyproject.toml"]

    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: "v0.1.41"
      hooks:
          - id: rumdl-fmt # auto-format and fail if issues remain
            stages: [pre-commit]

    # - repo: https://github.com/facebook/pyrefly-pre-commit
    #   rev: 0.52.0
    #   hooks:
    #       - id: pyrefly-check
    #         name: Pyrefly (type checking)
    #         # pass_filenames: false # full repo checks
    #         pass_filenames: true # check only committed files
    #         language: system

ci:
    autoupdate_schedule: weekly
    skip: [
            # steps mostly for user reference, skipping on ci
            pyrefly-check,
            trailing-whitespace,
            debug-statements,
            check-builtin-literals,
        ]
    submodules: false
