[project]
    authors = [{ name = "SADE Team" }]
    dependencies = [
        "droneresponse-mathtools",
        "loguru>=0.7.0",
        "mavsdk>=3.10.0",
        "paho-mqtt>=2.0.0",
        "pydantic>=2.0.0",
        "rich>=14.1.0",
    ]
    description = "Customizable autonomous drone missions for SADE simulations"
    name = "software-pilot"
    readme = "README.md"
    requires-python = ">=3.14,<3.15"
    version = "0.1.0"

    [project.scripts]
        software-pilot = "software_pilot.cli:main"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.10.8,<0.11.0"]

[tool.uv]
    package = true

    [tool.uv.sources]
        # https://github.com/DroneResponse/python-droneresponse-mathtools
        droneresponse-mathtools = { url = "https://mm-public-fileshare.s3.us-west-2.amazonaws.com/droneresponse_mathtools-1.0.3-py3-none-any.whl" }

[dependency-groups]
    dev = [
        "bandit>=1.9.3",
        "pre-commit>=4.5.1",
        "prek>=0.3.4",
        "pyrefly>=0.52.0",
        "pytest-asyncio>=0.23.0",
        "pytest-cov>=5.0.0",
        "pytest>=8.0.0",
        "ruff>=0.15.1",
    ]

[tool.pytest]

    [tool.pytest.ini_options]
        asyncio_mode     = "auto"
        python_classes   = ["Test*"]
        python_files     = ["test_*.py"]
        python_functions = ["test_*"]
        testpaths        = ["tests"]
