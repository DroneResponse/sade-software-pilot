[project]
    authors = [{ name = "SADE Team" }]
    dependencies = [
        "droneresponse-mathtools",
        "loguru>=0.7.0",
        "mavsdk>=3.10.0",
        "paho-mqtt>=2.0.0",
        "pydantic>=2.0.0",
        "rich>=14.1.0",
    ]
    description = "Customizable autonomous drone missions for SADE simulations"
    name = "software-pilot"
    readme = "README.md"
    requires-python = ">=3.11,<3.12"
    version = "0.1.0"

    [project.scripts]
        software-pilot = "software_pilot.cli:main"

    [project.optional-dependencies]
        dev = [
            "bandit>=1.7.0",
            "mypy>=1.0.0",
            "pre-commit>=4.0.0",
            "pytest>=8.0.0",
            "pytest-cov>=5.0.0",
            "ruff>=0.8.0",
        ]

[build-system]
    build-backend = "hatchling.build"
    requires      = ["hatchling"]

[tool.uv]
    package = true

    [tool.uv.sources]
        droneresponse-mathtools = { url = "https://mm-public-fileshare.s3.us-west-2.amazonaws.com/droneresponse_mathtools-0.3.0-py2.py3-none-any.whl" }

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "pre-commit>=4.5.1",
]
